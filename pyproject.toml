[project]
name = "annotation-gui"
version = "0.1.0"
description = "SSL Annotation Studio: desktop bounding-box annotation and dataset export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0.0",
    "pyside6-essentials>=6.6.0",
]

[project.optional-dependencies]
ai = ["torch>=2.4,<2.11", "torchvision>=0.19,<0.26", "transformers>=4.50,<5"]

[dependency-groups]
build = ["pyinstaller>=6.0.0"]
